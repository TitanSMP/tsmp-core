# Copy to config/titansmp.properties for local development.
# All credentials below are placeholders and must be replaced locally.

server.id=smp-01
server.type=SMP
server.environment=DEVELOPMENT
network.name=TitanSMP

database.host=127.0.0.1
database.port=3306
database.name=titansmp
database.username=example_user
database.password=REPLACE_WITH_LOCAL_DUMMY_PASSWORD
database.maximumPoolSize=10

redis.host=127.0.0.1
redis.port=6379
# Leave empty for a local Redis instance without authentication.
redis.password=

# Maximum time Velocity waits for the source server to prepare a player transfer.
data-bridge.transfer.timeout-ms=5000

# Discord integration (see docs/discord.md). Discord IDs are configuration values and are
# never hardcoded in source code.
discord.enabled=false
# The bot token is never committed. Leave this empty and provide the token through the
# TITANSMP_DISCORD_TOKEN environment variable, which overrides this value.
discord.token=
# Guild of the bot, the Minecraft chat channel, and the verified role, as Discord snowflakes.
discord.guild-id=
discord.minecraft-chat-channel-id=
discord.verified-role-id=
# Link codes are single-use, time-limited, and hashed before they are stored.
discord.linking.token-expiration-minutes=10
discord.linking.max-attempts-per-window=5
discord.linking.attempt-window-seconds=60
