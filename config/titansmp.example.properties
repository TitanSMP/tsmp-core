# Copy to config/titansmp.properties for local development.
# All credentials below are placeholders and must be replaced locally.

server.id=smp-01
server.type=SMP
server.environment=DEVELOPMENT
network.name=TitanSMP

database.host=127.0.0.1
database.port=3306
database.name=titansmp
database.username=example_user
database.password=REPLACE_WITH_LOCAL_DUMMY_PASSWORD
database.maximumPoolSize=10

redis.host=127.0.0.1
redis.port=6379
# Leave empty for a local Redis instance without authentication.
redis.password=

# Maximum time Velocity waits for the source server to prepare a player transfer.
data-bridge.transfer.timeout-ms=5000

# Discord integration (see docs/discord.md). Discord IDs are configuration values and are
# never hardcoded in source code.
discord.enabled=false
# The bot token is never committed. Leave this empty and provide the token through the
# TITANSMP_DISCORD_TOKEN environment variable, which overrides this value.
discord.token=
# Guild of the bot, the Minecraft chat channel, and the verified role, as Discord snowflakes.
discord.guild-id=
discord.minecraft-chat-channel-id=
discord.verified-role-id=
# Link codes are single-use, time-limited, and hashed before they are stored.
discord.linking.token-expiration-minutes=10
discord.linking.max-attempts-per-window=5
discord.linking.attempt-window-seconds=60

# Network-wide server transfer and queue system (see docs/server-transfer.md).
# Server types, backend names, and aliases are configuration values. Backend names are never
# hardcoded in source code; the mapping below is an example only.
server-transfer.enabled=false
server-transfer.default-priority=0
server-transfer.queue.actionbar-interval-ms=1000
server-transfer.queue.reservation-timeout-ms=5000
server-transfer.queue.processing-interval-ms=1000

server-transfer.aliases.lobby=lobby
server-transfer.aliases.hub=lobby

server-transfer.types.lobby.enabled=true
server-transfer.types.lobby.max-players=100
server-transfer.types.smp.enabled=true
server-transfer.types.smp.max-players=50

server-transfer.backends.lobby-01.type=lobby
server-transfer.backends.lobby-02.type=lobby
server-transfer.backends.smp-01.type=smp
server-transfer.backends.smp-02.type=smp

# LuckPerms queue priorities use titansmp.server.priority.<number>; a higher number wins.

# Network-wide player statistics (see docs/stats.md).
# Server identity types are configuration values matched case-insensitively against this server's
# configured server.type. `smp` and `lobby` below are examples only; no server name and no type name
# is hardcoded in source code.
stats.enabled=false
# Local counters are batched and flushed to MariaDB on this interval; nothing is written per tick.
stats.flush-interval-ms=5000

# joins is network-wide: it counts an actual network entry, never an intra-network server switch.
stats.tracking.joins.enabled=true
stats.tracking.joins.scope=network

# Every other statistic is collected only on the configured server identity types.
stats.tracking.playtime.enabled=true
stats.tracking.playtime.scope=server-types
stats.tracking.playtime.server-types=smp

stats.tracking.blocks-mined.enabled=true
stats.tracking.blocks-mined.scope=server-types
stats.tracking.blocks-mined.server-types=smp

stats.tracking.blocks-walked.enabled=true
stats.tracking.blocks-walked.scope=server-types
stats.tracking.blocks-walked.server-types=smp

stats.tracking.blocks-elytra.enabled=true
stats.tracking.blocks-elytra.scope=server-types
stats.tracking.blocks-elytra.server-types=smp

stats.tracking.damage-taken.enabled=true
stats.tracking.damage-taken.scope=server-types
stats.tracking.damage-taken.server-types=smp

stats.tracking.damage-dealt.enabled=true
stats.tracking.damage-dealt.scope=server-types
stats.tracking.damage-dealt.server-types=smp

stats.tracking.mobs-killed.enabled=true
stats.tracking.mobs-killed.scope=server-types
stats.tracking.mobs-killed.server-types=smp

stats.tracking.players-killed.enabled=true
stats.tracking.players-killed.scope=server-types
stats.tracking.players-killed.server-types=smp

stats.tracking.deaths.enabled=true
stats.tracking.deaths.scope=server-types
stats.tracking.deaths.server-types=smp

# Network-wide friends
friends.enabled=true
friends.page-size=10

# Network-wide clans
clans.enabled=true
teleport.enabled=true
teleport.default-cooldown-minutes=30
teleport.default-home-limit=1
teleport.tpa.request-expiration-seconds=60
teleport.rtp.max-attempts=20
teleport.rtp.server-types=
teleport.clan.default-home-limit=1
auction-house.enabled=true
auction-house.expiration-hours=48
auction-house.items-per-page=45
auction-house.search-timeout-seconds=30
auction-house.default-auction-limit=5
auction-house.sell-fee-percent=0
auction-house.aliases=auctionhouse,auction

