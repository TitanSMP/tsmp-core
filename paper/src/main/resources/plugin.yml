name: TitanSMP
version: '${project.version}'
main: de.titansmp.paper.TitanSmpPaperPlugin
api-version: '26.3'
description: TitanSMP network platform integration
depend:
  - LuckPerms
commands:
  ec:
    description: Open your TitanSMP EnderChest
    usage: /ec
  ban:
    description: Ban a player from the TitanSMP network
    usage: /ban <player> [reason]
  unban:
    description: Remove a player's active network ban
    usage: /unban <player> [reason]
  mute:
    description: Mute a player on the TitanSMP network
    usage: /mute <player> [duration] [reason]
  unmute:
    description: Remove a player's active network mute
    usage: /unmute <player> [reason]
  kick:
    description: Kick an online player from the TitanSMP network
    usage: /kick <player> [reason]
  link:
    description: Create a single-use code to link your Minecraft account with a Discord account
    usage: /link
  unlink:
    description: Remove the Discord account linked to your Minecraft account
    usage: /unlink
permissions:
  titansmp.enderchest.rows.1:
    description: Grants access to one row of TitanSMP EnderChest storage
    default: true
  titansmp.enderchest.rows.2:
    description: Grants access to two rows of TitanSMP EnderChest storage
    default: false
  titansmp.moderation.ban:
    description: Allows network bans
    default: false
  titansmp.moderation.unban:
    description: Allows removing network bans
    default: false
  titansmp.moderation.mute:
    description: Allows network mutes
    default: false
  titansmp.moderation.unmute:
    description: Allows removing network mutes
    default: false
  titansmp.moderation.kick:
    description: Allows network kicks
    default: false
  titansmp.moderation.immunity:
    description: Prevents moderation punishments against this player
    default: false
  titansmp.chat.use:
    description: Allows using network chat
    default: true
  titansmp.chat.color:
    description: Reserved for future network chat color formatting
    default: false
  titansmp.chat.format:
    description: Reserved for future network chat formatting
    default: false
  titansmp.chat.global:
    description: Reserved for future network chat modes
    default: false
libraries:
  - org.jetbrains.kotlin:kotlin-stdlib:2.4.21
  - com.zaxxer:HikariCP:7.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.5.10
  - org.flywaydb:flyway-core:13.10.2
  - org.flywaydb:flyway-mysql:13.10.2
  - io.lettuce:lettuce-core:7.8.0.RELEASE
  - com.fasterxml.jackson.module:jackson-module-kotlin:2.22.2
  - com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.2
